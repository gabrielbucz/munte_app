<section class="mx-auto flex w-full max-w-md flex-col gap-4 rounded-lg border border-borda bg-superficie p-6">
  <h1 class="text-2xl font-semibold text-texto">Oferecer carona</h1>

  <form [formGroup]="form" class="flex flex-col gap-4">
    <fieldset class="flex flex-col gap-2">
      <legend class="text-sm font-semibold text-texto">Sentido</legend>
      <div class="flex gap-4">
        <label class="flex items-center gap-2 text-base text-texto">
          <input type="radio" formControlName="direction" value="outbound" />
          Ida
        </label>
        <label class="flex items-center gap-2 text-base text-texto">
          <input type="radio" formControlName="direction" value="return" />
          Volta
        </label>
      </div>
    </fieldset>

    <div class="flex flex-col gap-2">
      <label for="neighborhoodId" class="text-sm font-semibold text-texto">Bairro</label>
      <select
        id="neighborhoodId"
        formControlName="neighborhoodId"
        class="rounded-lg border border-borda bg-superficie px-3 py-2 text-base text-texto
               focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-primaria/25"
      >
        <option value="" disabled>Selecione</option>
        @for (neighborhood of neighborhoods(); track neighborhood.id) {
          <option [value]="neighborhood.id">{{ neighborhood.name }}</option>
        }
      </select>
    </div>

    <div class="flex flex-col gap-2">
      <label for="pickupPointId" class="text-sm font-semibold text-texto">Ponto</label>
      <select
        id="pickupPointId"
        formControlName="pickupPointId"
        class="rounded-lg border border-borda bg-superficie px-3 py-2 text-base text-texto
               focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-primaria/25"
      >
        <option value="" disabled>Selecione</option>
      </select>
    </div>

    <div class="flex flex-col gap-2">
      <label for="departureTime" class="text-sm font-semibold text-texto">Horário</label>
      <input
        id="departureTime"
        type="datetime-local"
        formControlName="departureTime"
        class="rounded-lg border border-borda bg-superficie px-3 py-2 text-base text-texto
               focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-primaria/25"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label for="seats" class="text-sm font-semibold text-texto">Vagas</label>
      <input
        id="seats"
        type="number"
        formControlName="seats"
        class="rounded-lg border border-borda bg-superficie px-3 py-2 text-base text-texto
               focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-primaria/25"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label for="notes" class="text-sm font-semibold text-texto">Observações</label>
      <textarea
        id="notes"
        formControlName="notes"
        rows="3"
        class="rounded-lg border border-borda bg-superficie px-3 py-2 text-base text-texto
               focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-primaria/25"
      ></textarea>
    </div>
  </form>
</section>
