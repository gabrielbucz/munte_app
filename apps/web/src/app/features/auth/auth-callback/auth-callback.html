<section class="mx-auto flex w-full max-w-md flex-col gap-4 rounded-lg border border-borda bg-superficie p-6">
  @if (linkInvalido()) {
    <p role="alert" class="text-sm font-semibold text-perigo">
      e-mail não permitido ou link inválido
    </p>
  } @else {
    <h1 class="text-2xl font-semibold text-texto">Confirmando seu acesso</h1>
    <p class="text-sm text-texto-suave">Aguarde enquanto conferimos o link de confirmação.</p>
  }
</section>
